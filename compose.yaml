name: feedback-partner-client

services:
  feedback-partner-client:
    # Built by GitHub Actions (.github/workflows/deploy.yml); TAG is the commit SHA of the deploy.
    image: ghcr.io/linkandreas/feedback-partner-client:${TAG:-latest}
    container_name: feedback-partner-client
    # No published ports: the cloudflared container on the `web` network reaches it at
    # http://feedback-partner-client:32774 and serves it (with HTTPS) at the domain.
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
